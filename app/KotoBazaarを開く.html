l:`https://forms.gle/JmaTubGR56G9V8S89`},a=`kb001.kb002.kb004.kb006.kb010.kb011.kb012.kb013.kb014.kb017.kb021.kb023.kb026.kb027.kb028.kb031.kb033.kb037.kb038.kb039.kb041.kb042.kb044.kb045.kb048.kb049.kb050.kb051.kb052.kb055.kb056.kb057.kb058.kb060.kb061.kb062.kb068.kb070.kb071.kb073.kb076.kb077.kb081.kb083.kb085.kb092.kb093.kb098.kb100.kb018`.split(`.`),o={id:`kb-original-draft-2026-08`,sourceType:`original`,title:`KotoBazaar編集部による独自語釈・例文（人間確認前）`,publisherOrProvider:`KotoBazaar`,accessedAt:`2026-08-23`,copyrightStatus:`unverified`,rightsNotes:`AIを補助に作成した編集候補。人間による語義・用例・権利確認が完了するまで配布不可。`},s=[[`宵`,`よい`,`日が暮れて間もないころ。夜がまだ深まりきらない時間。`,`朝・夕・夜`,[`夕暮れ`,`夜`,`静けさ`,`淡い光`],`宵の風が、昼の熱を少しずつさらっていった。`,`夜の入口に立つような、やわらかな余白を含む。`],[`夜の帳`,`よるのとばり`,`夜の暗さが、帳を下ろすように辺りを包むこと。`,`朝・夕・夜`,[`夜`,`暗闇`,`包む`,`静けさ`],`夜の帳が下りると、港の灯だけが水面に残った。`,`暗さを布に見立てた、視覚的で文学的な表現。`],[`逢魔が時`,`おうまがとき`,`夕暮れの薄暗い時間帯。古く、災いに遭いやすいと考えられたころ。`,`朝・夕・夜`,[`夕暮れ`,`薄暗い`,`怪異`,`境界`],`逢魔が時の路地は、見慣れた町をよそよそしく見せた。`,`ものの輪郭が曖昧になり、日常と異界の境目を感じさせる。`],[`黄昏`,`たそがれ`,`夕暮れどき。人の姿を見分けにくくなる薄暗い時間。`,`朝・夕・夜`,[`夕方`,`薄明`,`郷愁`,`移ろい`],`黄昏の駅に、別れの言葉だけが取り残された。`],[`薄暮`,`はくぼ`,`日没後、わずかな明るさが残るころ。`,`朝・夕・夜`,[`夕方`,`薄暗い`,`静けさ`],`薄暮の庭で、白い花だけがほのかに浮かんだ。`],[`暁`,`あかつき`,`夜が明けようとするころ。夜明け。`,`朝・夕・夜`,[`夜明け`,`希望`,`冷気`],`長い雨は、暁とともにようやく途切れた。`,`新しい始まりを暗示する場面にもなじむ、引き締まった明るさを含む。`],[`東雲`,`しののめ`,`東の空がほのかに白み始めるころ。`,`朝・夕・夜`,[`夜明け`,`空`,`淡い光`],`東雲の空に、鳥の声がひとつほどけた。`],[`曙`,`あけぼの`,`夜が明け始めるころ。また、その空の明るみ。`,`朝・夕・夜`,[`夜明け`,`光`,`始まり`],`曙の色が、眠る屋根を静かに染めていく。`],[`朝ぼらけ`,`あさぼらけ`,`夜明け方、辺りがぼんやり明るくなるころ。`,`朝・夕・夜`,[`早朝`,`霞`,`淡い光`],`朝ぼらけの川辺に、舟の影がゆっくり現れた。`],[`有明`,`ありあけ`,`夜明け方。とくに、月が空に残るころを指す古風な語。`,`朝・夕・夜`,[`月`,`夜明け`,`名残`],`有明の月を見上げ、彼女は言えなかった名を胸に戻した。`,`夜と朝の境目や、去りきらないものの気配を描く場面に向く。`],[`月白`,`つきしろ`,`月が出ようとするとき、東の空が白んで明るく見えること。`,`光と影`,[`月`,`東の空`,`淡い光`,`秋`],`月白の空を待つうちに、庭の虫の音が近くなった。`,`月そのものが現れる前の、光の予兆と静かな期待を描ける。`],[`朧月`,`おぼろづき`,`春の霞などで、ぼんやりとかすんで見える月。`,`春`,[`月`,`霞`,`春`,`やわらかい`],`朧月の下では、遠い約束さえ近く思えた。`],[`月影`,`つきかげ`,`月の光。また、月そのものを指すこともある。`,`光と影`,[`月`,`光`,`影`,`夜`],`月影が、誰もいない廊下を細く渡っていた。`,`月光や水面の反映を通して、夜の静けさを描く場面に向く。`],[`月冴ゆ`,`つきさゆ`,`冬の澄んだ夜空に、月がくっきり冷たく輝くこと。`,`冬`,[`月`,`冬`,`冷たい`,`澄明`],`月冴ゆる夜、吐く息まで銀色に見えた。`],[`星月夜`,`ほしづきよ`,`月がなくても、星明かりで明るく感じられる夜。`,`朝・夕・夜`,[`星`,`夜`,`澄明`,`光`],`星月夜の道を、二人は言葉もなく歩いた。`],[`小夜`,`さよ`,`夜を表す古風な語。`,`古語・雅語`,[`夜`,`静けさ`,`古風`],`小夜の雨音に、旅の疲れがほどけていった。`,`夜をやわらかく雅やかに響かせ、静かな場面に余韻を添える。`],[`夜半`,`よわ／やはん`,`夜のなかば。夜が更けたころ。文脈によって真夜中を指す。`,`朝・夕・夜`,[`深夜`,`静寂`,`暗闇`],`夜半の鐘が、眠れない部屋まで届いた。`],[`夜長`,`よなが`,`秋の、夜が長く感じられること。`,`秋`,[`秋`,`夜`,`読書`,`物思い`],`夜長に読み返した手紙は、昔よりも短かった。`],[`宵闇`,`よいやみ`,`日が暮れた直後の、まだ浅い闇。`,`朝・夕・夜`,[`夕暮れ`,`暗闇`,`気配`],`宵闇の庭で、金木犀の香りだけが道を教えた。`],[`暗夜`,`あんや`,`月明かりのない、深く暗い夜。`,`朝・夕・夜`,[`暗闇`,`不安`,`静寂`],`暗夜を縫うように、遠い灯台がまたたいた。`],[`木漏れ日`,`こもれび`,`木々の葉の間から差し込む、まだらな日差し。`,`光と影`,[`光`,`木々`,`昼`,`穏やか`],`木漏れ日が、本の頁にゆっくり揺れていた。`],[`斜陽`,`しゃよう`,`斜めに差す夕日の光。衰えゆくものの比喩にも使う。`,`光と影`,[`夕日`,`傾く`,`衰退`,`金色`],`斜陽が古い校舎の傷をやさしく照らした。`],[`残照`,`ざんしょう`,`日が沈んだあとも空や雲に残る夕日の光。`,`光と影`,[`夕焼け`,`名残`,`赤`,`移ろい`],`残照のなかで、山の端だけが燃えるようだった。`],[`夕映え`,`ゆうばえ`,`夕日の光を受けて、空や景色が美しく映えること。`,`光と影`,[`夕日`,`赤`,`美しさ`],`夕映えの窓に、帰らない人の席が映った。`],[`薄明`,`はくめい`,`日の出前または日没後の、ほのかな明るさ。`,`光と影`,[`淡い光`,`境界`,`静けさ`],`薄明の街は、夢から覚める途中に見えた。`],[`陽炎`,`かげろう`,`暖められた空気により、景色が揺らいで見える現象。`,`夏`,[`熱`,`揺らぐ`,`幻`,`昼`],`陽炎の向こうで、白い道が空へ続いていた。`],[`玉響`,`たまゆら`,`ほんのわずかな間。つかのま。`,`古語・雅語`,[`一瞬`,`儚い`],`玉響の沈黙に、答えより深い思いが宿った。`,`ごく短い時間を、儚さや余韻を伴って示す古風な表現。`],[`泡沫`,`うたかた`,`水に浮かぶ泡。消えやすく儚いもののたとえ。`,`水・雨・雪`,[`水`,`儚い`,`消える`,`無常`],`泡沫の夢だとしても、あの夏は確かに眩しかった。`],[`水鏡`,`みずかがみ`,`静かな水面が、鏡のように景色を映すこと。`,`水・雨・雪`,[`水面`,`反射`,`静けさ`,`空`],`水鏡に映る月を、魚の波紋がそっと崩した。`],[`漣`,`さざなみ`,`水面に細かく立つ波。心の小さな揺れにもたとえる。`,`水・雨・雪`,[`水面`,`波`,`微動`,`心`],`一言の返事が、胸の内に漣を立てた。`],[`時雨`,`しぐれ`,`晩秋から初冬に、降ったりやんだりする雨。`,`水・雨・雪`,[`雨`,`冬`,`通り雨`,`侘び`],`時雨が過ぎると、石畳は夜の色を映した。`],[`村雨`,`むらさめ`,`ひとしきり強く降って、すぐにやむ雨。`,`水・雨・雪`,[`雨`,`急`,`短い`,`古風`],`村雨が去り、軒先から雫が連なって落ちた。`],[`霧雨`,`きりさめ`,`霧のように細かな雨。`,`水・雨・雪`,[`雨`,`霧`,`細かい`,`静か`],`霧雨に濡れた髪から、春の匂いがした。`],[`小糠雨`,`こぬかあめ`,`糠のように細かく降る雨。霧雨のような弱い雨。`,`水・雨・雪`,[`雨`,`細かい`,`春`,`やわらかい`],`小糠雨の朝、町の音は布越しのように遠かった。`,`静かでやわらかな雨景色を描きたいときに向く。`],[`驟雨`,`しゅうう`,`急に激しく降り、短時間でやむ雨。`,`水・雨・雪`,[`雨`,`激しい`,`夏`,`急変`],`驟雨が屋根を叩き、会話を一瞬さらっていった。`],[`雨脚`,`あまあし`,`線のように見える雨の降り方。また、その強さ。`,`水・雨・雪`,[`雨`,`視覚`,`強さ`,`動き`],`雨脚が白く煙り、向かいの家さえ見えなくなった。`],[`雪催い`,`ゆきもよい`,`今にも雪が降り出しそうな空模様。`,`冬`,[`雪`,`曇天`,`予感`,`冷たい`],`雪催いの空の下、鳥たちは低く飛んでいた。`],[`風花`,`かざはな`,`晴れた空から、風に運ばれてちらつく雪。`,`冬`,[`雪`,`風`,`晴れ`,`儚い`],`風花が一片、彼女の黒い袖にとまった。`],[`細雪`,`ささめゆき`,`細かく、静かに降る雪。`,`冬`,[`雪`,`細かい`,`静けさ`,`白`],`細雪の向こうで、町の灯が淡くにじんだ。`],[`淡雪`,`あわゆき`,`春先などに降り、すぐ消えるやわらかな雪。`,`冬`,[`雪`,`春`,`儚い`,`やわらかい`],`掌の淡雪は、願いを言う前に消えた。`],[`薫風`,`くんぷう`,`初夏、新緑の香りを運ぶ爽やかな風。`,`風・空気`,[`風`,`初夏`,`香り`,`爽やか`],`薫風が、開け放した窓から便箋をめくった。`],[`東風`,`こち`,`春に東から吹く風。`,`春`,[`風`,`春`,`梅`,`古風`],`東風に誘われ、梅の香が垣根を越えてきた。`],[`木枯らし`,`こがらし`,`晩秋から初冬に吹く、冷たく強い風。`,`風・空気`,[`風`,`冬`,`冷たい`,`枯葉`],`木枯らしが、商店街の旗を忙しく鳴らした。`],[`野分`,`のわき`,`秋に野の草を吹き分けるような強い風。台風を指す古語。`,`秋`,[`風`,`嵐`,`秋`,`古風`],`野分のあとの庭に、折れた萩が香っていた。`],[`凪`,`なぎ`,`風がやみ、海面が静まること。`,`風・空気`,[`海`,`無風`,`静けさ`,`停止`],`凪の海は、別れの言葉まで呑み込んでいた。`],[`風渡る`,`かぜわたる`,`風が広い場所や木々の間を通り抜けること。`,`風・空気`,[`風`,`草原`,`木々`,`音`],`風渡る草原に、銀色の穂がいっせいに傾いた。`],[`朝凪`,`あさなぎ`,`海辺で、朝に風がやんで静かになること。`,`風・空気`,[`朝`,`海`,`静けさ`,`穏やか`],`朝凪の港で、綱の軋む音だけがした。`],[`夕凪`,`ゆうなぎ`,`海辺で、夕方に風がやみ、海面が静まること。`,`風・空気`,[`夕方`,`海`,`無風`,`暑い`],`夕凪の町に、祭囃子がいつまでも残った。`,`夏の海辺では、風の止んだ蒸し暑さや時間の停滞も感じさせる。`],[`山背`,`やませ`,`夏、北日本の太平洋側に吹く冷たく湿った風。`,`風・空気`,[`風`,`夏`,`冷たい`,`湿気`],`山背が流れ込み、畑の緑は白い霧に沈んだ。`],[`青嵐`,`あおあらし`,`青葉のころ、木々を激しく揺らして吹く風。`,`夏`,[`風`,`青葉`,`初夏`,`力強い`],`青嵐が梢を駆け、森全体が目を覚ました。`],[`花冷え`,`はなびえ`,`桜の咲くころに戻ってくる寒さ。`,`春`,[`桜`,`寒い`,`春`,`季節の戻り`],`花冷えの夜、二人は同じ外套の袖を寄せた。`],[`春霞`,`はるがすみ`,`春、空や遠景が霞んで見えること。`,`春`,[`霞`,`遠景`,`春`,`淡い`],`春霞の向こうに、故郷の山が薄く浮かんだ。`],[`春宵`,`しゅんしょう`,`春の、趣深く心地よい宵。`,`春`,[`春`,`宵`,`穏やか`,`香り`],`春宵の庭に、ほどけた笑い声が漂った。`],[`春暁`,`しゅんぎょう`,`春の明け方。`,`春`,[`春`,`夜明け`,`鳥`,`やわらかい`],`春暁、障子の白みに鳥の声が重なった。`,`眠りから覚めきらないような、やわらかな朝の気配を添えやすい。`],[`夏隣`,`なつどなり`,`春の終わり、夏がすぐそこまで来ている気配。`,`春`,[`晩春`,`夏`,`予感`,`緑`,`季節の境界`],`夏隣の風に、木々の緑が一段濃く見えた。`,`まだ春でありながら、光や風に次の季節を感じる場面に向く。`],[`短夜`,`みじかよ`,`夏の短い夜。`,`夏`,[`夏`,`夜`,`夜明け`,`名残`],`短夜を惜しむように、窓辺の話は尽きなかった。`],[`秋麗`,`あきうらら`,`秋の空が晴れ、明るく穏やかなこと。`,`秋`,[`秋`,`晴れ`,`穏やか`,`空`],`秋麗の道を、乾いた落葉が追い越していった。`],[`秋思`,`しゅうし`,`秋の景色に触れて生じる、もの寂しい思い。`,`秋`,[`秋`,`寂しさ`,`物思い`,`夕暮れ`],`秋思に沈む窓辺で、冷めた茶だけが香っていた。`],[`冬ざれ`,`ふゆざれ`,`冬
